# Build the linux/arm64 image for the Pi. Every PR that touches the image
# builds it and smoke-tests it under QEMU, which proves the Pi's prebuilt
# better-sqlite3 binary loads; pushes to main also publish it to GHCR as
# `latest`, the package.json version, and `sha-<short commit>` (the tag a
# rollback pins with IMAGE_TAG in docker-infra).
name: build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - scripts/smoke-image.sh
      - .github/workflows/build.yml
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/davidwinterbottom-2/meal-planner

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Anonymous Docker Hub pulls from shared runners hit its rate limit
      # (the first run failed pulling tonistiigi/binfmt). Every image this job
      # needs from Docker Hub comes through Google's mirror instead: QEMU's
      # binfmt image, BuildKit itself, and (via the registry mirror) the
      # Dockerfile's node base image.
      - uses: docker/setup-qemu-action@v3
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: meal-planner:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (arm64 under QEMU)
        run: scripts/smoke-image.sh meal-planner:smoke linux/arm64

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
