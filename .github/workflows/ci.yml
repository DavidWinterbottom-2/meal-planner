name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # §2: every PR must bump the version in its single source of truth, or this
  # fails the PR. Unconditional on purpose (see the version-bump-check skill) —
  # no path filter guessing which PRs "ship", since over-bumping a docs/CI-only
  # PR is harmless (images deploy by SHA) but a missed real bump isn't.
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if the version wasn't bumped
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          new=$(jq -r .version package.json)
          old=$(git show "$base:package.json" | jq -r .version)

          echo "old=$old new=$new"
          if [ "$old" = "$new" ]; then
            echo "::error::version not bumped ($new). Bump it with your stack's tool." && exit 1
          fi

  # §10: lint + format-check every file. Runs in check mode so an unformatted or
  # lint-failing file fails the PR rather than being reformatted behind your back.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint

  # §4: run the tests and enforce the >=80% coverage floor. The gate fails the PR
  # when coverage drops below 80% — it is not merely reported.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # The vendored OAuth module keeps its own node:test suite (src/vendor/README.md).
      - run: npm run test:vendor

  # End-to-end: build the image, start it, and drive both listeners with
  # Playwright (tests/e2e). Uploads 390px light/dark screenshots of the week
  # page. Docker Hub pulls go through mirror.gcr.io (see build.yml).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: meal-planner:e2e
          cache-from: type=gha
      - name: Start the image
        run: |
          docker run -d --name meal-planner -p 127.0.0.1:3000:3000 -p 127.0.0.1:3001:3001 \
            -e MCP_API_KEY="$(openssl rand -hex 32)" meal-planner:e2e
          for _ in $(seq 60); do curl -sf http://127.0.0.1:3001/history >/dev/null && exit 0; sleep 1; done
          docker logs meal-planner; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-screenshots
          path: test-results/
