name: template-sync

# Pulls the shared skills library (plus this workflow, claude.yml and the PR
# template) from the devcontainer-sandbox template and opens a PR when this repo
# has drifted behind it. Retrofit onto ANY repo (bootstrapped from the template
# or not) by adding this file AND a repo secret TEMPLATE_SYNC_TOKEN.
#
# TEMPLATE_SYNC_TOKEN must be a PAT with, on the downstream repo,
# contents:write + workflows:write + pull-requests:write, and contents:read on
# this private template repo so the workflow can check it out. A classic PAT with
# the `repo` + `workflow` scopes covers both; a fine-grained PAT needs Contents
# (read/write), Workflows (write) and Pull requests (write). Both the push AND the
# PR are done with this PAT — NOT the default GITHUB_TOKEN — for two reasons the
# default token cannot satisfy:
#   1. The sync copies workflow files (.github/workflows/*); GitHub refuses to let
#      the automatic GITHUB_TOKEN create/update those without the `workflows`
#      scope, which it can never hold, so the push is rejected outright.
#   2. Creating the PR with a PAT sidesteps the org/repo "Allow GitHub Actions to
#      create and approve pull requests" setting, which blocks GITHUB_TOKEN.
# The first run brings in the skills. The .devcontainer/ is intentionally NOT
# auto-synced: it carries per-project deltas (see .devcontainer/TEMPLATE-SYNC.md)
# and wants a 3-way merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    # No-op in the template repo itself; only downstream copies sync.
    if: github.repository != 'DavidWinterbottom-2/devcontainer-sandbox'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the sync PAT
        env:
          TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TEMPLATE_SYNC_TOKEN is not set. It must be a PAT with contents:write + workflows:write + pull-requests:write on this repo and contents:read on the template (classic PAT: repo + workflow scopes)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Fetch the template (private → needs a read token)
        uses: actions/checkout@v4
        with:
          repository: DavidWinterbottom-2/devcontainer-sandbox
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: .template-src
          fetch-depth: 1

      - name: Sync the shared skills library + this workflow
        run: |
          tpl=.template-src
          mkdir -p .claude/skills .github/workflows
          manifest=$tpl/.claude/skills/.hermes-skills
          if [ -f "$manifest" ]; then
            # Only propagate the skills the manifest marks as shared; the rest stay
            # dev-environment-only in the template. Never delete repo-local skills.
            cp "$manifest" .claude/skills/.hermes-skills
            grep -vE '^\s*(#|$)' "$manifest" | while read -r s; do
              s=$(echo "$s" | xargs)
              [ -n "$s" ] && [ -d "$tpl/.claude/skills/$s" ] \
                && rsync -a "$tpl/.claude/skills/$s/" ".claude/skills/$s/"
            done
          else
            rsync -a "$tpl/.claude/skills/" .claude/skills/
          fi
          # The AI-workflow agents (architect + the independent critics) ride
          # along: the agents directory is template-owned — every agent in the
          # template's .claude/agents/ is shared by definition, and agents
          # retired from the template are deleted here too (--delete), so a
          # renamed or removed role doesn't linger downstream.
          if [ -d "$tpl/.claude/agents" ]; then
            mkdir -p .claude/agents
            rsync -a --delete "$tpl/.claude/agents/" .claude/agents/
          fi
          if [ -f "$tpl/.claude/hooks/require-tester.sh" ]; then
            mkdir -p .claude/hooks
            cp -p "$tpl/.claude/hooks/require-tester.sh" .claude/hooks/require-tester.sh
            # Ensure the hook's PostToolUse registration exists in this repo's
            # .claude/settings.json. Settings stay repo-local — nothing else in
            # the file is touched — but this one entry is the pipeline's
            # enforcement point, so the sync merges it in if it's missing.
            [ -f .claude/settings.json ] || echo '{}' > .claude/settings.json
            if ! jq -e '.hooks.PostToolUse[]?.hooks[]? | select(.command | contains("require-tester.sh"))' .claude/settings.json >/dev/null; then
              jq '.hooks.PostToolUse = ((.hooks.PostToolUse // []) + [{"matcher":"Write|Edit|MultiEdit","hooks":[{"type":"command","command":"$CLAUDE_PROJECT_DIR/.claude/hooks/require-tester.sh"}]}])' \
                .claude/settings.json > .claude/settings.json.tmp
              mv .claude/settings.json.tmp .claude/settings.json
            fi
          fi
          cp "$tpl/.github/workflows/template-sync.yml" .github/workflows/template-sync.yml
          # The label-gated Claude auto-work workflow rides along with the sync so
          # every templated repo can have a Hermes PR worked by Claude on demand.
          cp "$tpl/.github/workflows/claude.yml" .github/workflows/claude.yml
          # The shared PR template (§3 Summary / Changes / Validation) rides along too
          # so GitHub pre-fills every web-UI PR — and the create-pr skill fills the same
          # file — with one house style across all repos.
          cp "$tpl/.github/pull_request_template.md" .github/pull_request_template.md
          # Drop the template checkout so it never lands in the sync PR.
          rm -rf .template-src

      - name: Bump the version so the §2 version-bumped check passes
        # A skills-only sync touches no application code. A repo with a *whole-repo,
        # unconditional* §2 version-bumped check would reject such a PR forever
        # unless the version is bumped — so bump it here, in the same PR.
        #
        # Bump ONLY a single, whole-repo version source:
        #   • exactly one bump-my-version config (Python et al.) — the signature of a
        #     single-component repo (hermes, nutrition-tracker, every-day-calender,
        #     asset-overview whose sole config lives in containers/web); or
        #   • a single root Gradle version — root gradle.properties `version=` or root
        #     build.gradle.kts `version = "…"` (e.g. stock-data-platform's shared
        #     `allprojects { version }`).
        # Several bump-my-version configs → multi-component repo with per-component
        # gates (budget-analyzer: a pyproject.toml per service; sidecar-containers: a
        # .bumpversion.toml per sidecar); a skills-only sync changes no component, so
        # bumping an arbitrary one would be a spurious, misleading bump — skip. No
        # recognised single version source (npm, per-module Gradle, or no gate) → also
        # skip. This file is copied verbatim into every repo, so it discovers all this
        # at runtime rather than carrying a per-repo path.
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing drifted; no version bump needed."
            exit 0
          fi
          mapfile -t cfgs < <(grep -rlE '^\[(tool\.)?bumpversion\]' \
                  --include=pyproject.toml \
                  --include=.bumpversion.toml \
                  --include=.bumpversion.cfg \
                  --include=setup.cfg \
                  . 2>/dev/null || true)
          if [ "${#cfgs[@]}" -gt 1 ]; then
            printf 'Found %s bump-my-version configs (%s) — multi-component repo with per-component gates; a skills-only sync changes no component, so skipping bump.\n' \
              "${#cfgs[@]}" "${cfgs[*]}"
            exit 0
          fi
          if [ "${#cfgs[@]}" -eq 1 ]; then
            dir=$(dirname "${cfgs[0]}")
            echo "Single bump-my-version source in '${dir}'; bumping patch."
            python3 -m pip install --quiet --upgrade bump-my-version
            # --allow-dirty: the working tree already carries the synced skills.
            # --no-commit/--no-tag: leave committing to the PR step below.
            ( cd "$dir" && bump-my-version bump patch --allow-dirty --no-commit --no-tag )
            exit 0
          fi
          # No bump-my-version config → try a single whole-repo Gradle version. Only a
          # root version qualifies; a repo with per-module versions and no root version
          # falls through and skips, same as a multi-component Python repo.
          gfile=""; gver=""; gkind=""
          if [ -f gradle.properties ] && grep -qE '^version=[0-9]+\.[0-9]+\.[0-9]+' gradle.properties; then
            gfile=gradle.properties; gkind=props
            gver=$(grep -m1 -E '^version=' gradle.properties | sed -E 's/^version=([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          elif [ -f build.gradle.kts ] && grep -qE '^[[:space:]]*version = "[0-9]+\.[0-9]+\.[0-9]+' build.gradle.kts; then
            gfile=build.gradle.kts; gkind=kts
            gver=$(grep -m1 -E '^[[:space:]]*version = "[0-9]+\.[0-9]+\.[0-9]+' build.gradle.kts | sed -E 's/.*version = "([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          if [ -z "$gfile" ]; then
            echo "No bump-my-version config and no single Gradle version — no whole-repo version gate; skipping bump."
            exit 0
          fi
          IFS=. read -r MA MI PA <<< "$gver"
          nv="${MA}.${MI}.$((PA + 1))"
          echo "Single Gradle version in '${gfile}' (${gver}); bumping to ${nv}."
          if [ "$gkind" = props ]; then
            sed -i -E "s/^version=[0-9].*/version=${nv}/" gradle.properties
          else
            sed -i -E "s/^([[:space:]]*)version = \"[0-9]+\.[0-9]+\.[0-9]+/\1version = \"${nv}/" build.gradle.kts
          fi

      - name: Open a PR if anything drifted
        uses: peter-evans/create-pull-request@v6
        with:
          # Push AND open the PR with the PAT, not the default GITHUB_TOKEN: the
          # sync copies workflow files (which GITHUB_TOKEN may not push without the
          # `workflows` scope), and a PAT-authored PR sidesteps the "Allow Actions
          # to create PRs" repo setting. See the header for the required scopes.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          branch: template-sync/skills
          title: "chore: sync skills from devcontainer-sandbox template"
          commit-message: "chore: sync skills from devcontainer-sandbox template"
          labels: template-sync
          body: |
            Automated sync of the shared `.claude/skills/` library, the AI-workflow
            agents (`.claude/agents/` + `.claude/hooks/require-tester.sh`), the shared
            `.github/pull_request_template.md` (§3 Summary / Changes / Validation), and this
            workflow from the [devcontainer-sandbox](https://github.com/DavidWinterbottom-2/devcontainer-sandbox)
            template. Merge to adopt the latest skills and PR template.

            The patch version has been bumped automatically so the §2
            version-bumped check passes (no-op in repos with no version gate).

            The `.devcontainer/` is not auto-synced — update it via the manual/copier
            path (see `.devcontainer/TEMPLATE-SYNC.md`).
