<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Meal Planner app icon: a plate between a fork and a knife on the
       design system's amber. Full-bleed square (launchers and iOS round
       it); the drawing stays inside the maskable safe zone (r = 205). -->
  <rect width="512" height="512" fill="#a5620f"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="112" stroke-width="18"/>
    <circle cx="256" cy="256" r="74" stroke-width="9" opacity="0.55"/>
    <!-- fork -->
    <path d="M86 156v52M104 156v52M122 156v52" stroke-width="12"/>
    <path d="M86 208q0 30 18 30q18 0 18-30" stroke-width="12"/>
    <path d="M104 238v120" stroke-width="16"/>
    <!-- knife -->
    <path d="M408 358V250" stroke-width="16"/>
  </g>
  <path d="M400 154c26 18 34 58 26 100h-26z" fill="#ffffff"/>
</svg>
